[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-neuron-engineering"
version = "0.1.0"
description = "Interpretability and direct neural intervention without training"
requires-python = ">=3.11"
dependencies = ["torch>=2.11,<2.12"]

[project.optional-dependencies]
test = ["transformers==5.8.0"]

[tool.setuptools.packages.find]
include = ["interpretability*"]
